name: Update M3U Playlist

on:
  schedule:
    # Her 6 saatte bir otomatik çalışır (İsteğe göre değiştirebilirsiniz)
    - cron: '0 */6 * * *'
  workflow_dispatch: # GitHub arayüzünden manuel tetikleme imkanı sağlar

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Depodaki kodları çek
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Python Ortamını Kur
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. Kütüphaneleri ve Playwright Chromium Sürücüsünü Kur
      - name: Install Dependencies & Playwright
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium --with-deps

      # 4. Botu Çalıştır (Token'lar çekilir ve listem.m3u oluşturulur)
      - name: Run Bot Script
        run: python bot.py

      # 5. Güncellenmiş listem.m3u Dosyasını Depoya Commit Et
      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add listem.m3u
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update playlist [skip ci]" && git push)
